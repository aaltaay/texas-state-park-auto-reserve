[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campfind"
version = "0.1.0"
description = "Fast campsite availability lookup for Texas State Parks and Recreation.gov"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ahmi Altaay"}]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
campfind = "campfind.cli:main"

[tool.setuptools.packages.find]
include = ["campfind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
